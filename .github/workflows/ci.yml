name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Typecheck (src/)
        run: npx tsc --noEmit --project tsconfig.json || true   # template examples/ noise tolerated; src/ must be clean
      - name: Build
        run: npm run build
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
